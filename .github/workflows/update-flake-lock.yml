name: update-flake-lock

# Requires repo secret GH_TOKEN_FOR_UPDATES: a fine-grained PAT scoped to this
# repo with Contents + Pull requests read/write. PRs opened with the default
# GITHUB_TOKEN do not trigger other workflows, so check.yml would never run.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          pr-title: "flake.lock: update inputs"
          pr-labels: |
            dependencies
            automated
